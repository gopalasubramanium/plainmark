[package]
name = "plainmark"
version = "0.4.0"
description = "A quiet, free Markdown editor"
authors = ["Gopala Subramanium", "Plainmark contributors"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "plainmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
base64 = "0.22"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Backport the upstream GLib iterator soundness fix while Tauri uses GTK3.
[patch.crates-io]
glib = { path = "vendor/glib" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18"

# Use the desktop file portal for user-selected files and folders on Linux.
# Windows and macOS retain their native file panels.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSPathUtilities", "NSString", "NSURL"] }

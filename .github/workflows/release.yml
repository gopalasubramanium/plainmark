name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils shared-mime-info libglib2.0-bin
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: node scripts/check-version.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Plainmark v__VERSION__
          releaseBody: |
            Visual Markdown editing, folder workspaces, tabs, Mermaid and math, SVG previews, isolated runnable HTML, block scroll synchronization, and native Open with support for Windows, macOS, and Linux.

            Early preview: publisher signing/notarization and manual installation verification on every supported OS are still pending. macOS packages are ad-hoc signed; Windows packages are unsigned. See README for prerequisites and known limitations.

            Download the installer for your operating system below. The source archives correspond to this exact release. No accounts, ads, tracking, or paid features.
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify packaged Linux Open with integration
        if: runner.os == 'Linux'
        run: python3 scripts/check-linux-packages.py src-tauri/target/${{ matrix.target }}/release/bundle
